# Production deploy (T-120, 11 §11.9): main → ARM64 obraz → migratsiya
# (ALOHIDA qadam) → yangi versiya. Migratsiya yiqilsa — deploy to'xtaydi.
name: deploy

on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'packages/shared/**', 'package-lock.json']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/crm-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/crm
            export TAG=${{ github.sha }} GH_OWNER=${{ github.repository_owner }}
            docker compose -f docker-compose.prod.yml pull api
            # Migratsiya — alohida qadam; yiqilsa `set -e` deployni to'xtatadi
            docker compose -f docker-compose.prod.yml run --rm api npx prisma migrate deploy
            docker compose -f docker-compose.prod.yml up -d --no-deps api
            # Yangi versiya sog'lom bo'lguncha kutiladi
            for i in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose -f docker-compose.prod.yml ps -q api)")" = healthy ] && break
              sleep 5
            done
            curl -fsS "https://${API_DOMAIN:-localhost}/health/ready" >/dev/null || docker compose -f docker-compose.prod.yml logs --tail 100 api
            docker image prune -f
