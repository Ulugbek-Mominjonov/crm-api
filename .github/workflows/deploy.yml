# Production deploy (T-120, 11 §11.9): master → obraz (ghcr.io) → migratsiya
# (ALOHIDA qadam) → yangi versiya. Migratsiya yiqilsa — deploy to'xtaydi.
#
# Kerak (Settings → Secrets and variables → Actions, `production` environment):
#   secrets: SSH_HOST, SSH_KEY (deploy foydalanuvchisining maxfiy kaliti), SSH_USER (sukut: deploy),
#            SSH_FINGERPRINT — server kalitining SHA256 izi (tavsiya; bo'sh bo'lsa server tekshirilmaydi)
#   variables: DEPLOY_PLATFORM — server arxitekturasi (sukut linux/amd64; ARM server — linux/arm64)
name: deploy

on:
  push:
    branches: [master]
    paths: ['apps/api/**', 'packages/shared/**', 'package-lock.json']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      owner: ${{ steps.owner.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      # Obraz nomi (ghcr.io) faqat kichik harf — GitHub egasi nomida katta harf bo'lishi mumkin
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      # Faqat boshqa arxitektura uchun (ARM) kerak — amd64'da ishlatilmaydi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/crm-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    # Serverda obrazni tortish uchun: token faqat shu ish davomida amal qiladi
    permissions: { contents: read, packages: read }
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          TAG: ${{ github.sha }}
          GH_OWNER: ${{ needs.build.outputs.owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'deploy' }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: TAG,GH_OWNER,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/crm
            compose() { docker compose -f docker-compose.prod.yml "$@"; }

            # Obraz yopiq: shu deploy'ning qisqa muddatli tokeni bilan; tugagach kirish o'chiriladi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            compose pull api

            # Migratsiya — alohida qadam; yiqilsa `set -e` deployni to'xtatadi (eski versiya ishlab turadi)
            compose run --rm api npx prisma migrate deploy

            # Joriy obraz .env da — qo'lda `docker compose up` ham aynan shuni oladi
            sed -i '/^\(TAG\|GH_OWNER\)=/d' .env
            printf 'GH_OWNER=%s\nTAG=%s\n' "$GH_OWNER" "$TAG" >> .env
            # Faqat API almashadi: Caddy — umumiy kirishda (/opt/edge), baza va Redis tegilmaydi
            compose up -d --no-deps api

            # Yangi versiya sog'lom bo'lguncha kutiladi
            for _ in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$(compose ps -q api)")" = healthy ] && break
              sleep 5
            done
            # Tashqaridan (DNS, TLS, umumiy Caddy) — birinchi marta sertifikat olinguncha qayta urinadi
            CRM_DOMAIN=$(grep -E '^CRM_DOMAIN=' /opt/edge/.env | cut -d= -f2-)
            if ! curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://$CRM_DOMAIN/health/ready" >/dev/null; then
              compose logs --tail 100 api
              exit 1
            fi
            docker image prune -f
