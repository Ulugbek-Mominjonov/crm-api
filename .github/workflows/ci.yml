name: ci

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Portlar va nomlar — apps/api/.env.test bilan bir xil (testlar uni o'qiydi)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_test
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5433/crm_test?schema=public
      DIRECT_DATABASE_URL: postgresql://crm:crm@localhost:5433/crm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      # MinIO: services ichida buyruq berib bo'lmaydi — alohida konteyner
      - name: MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/live && break; sleep 1; done
          export AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin AWS_DEFAULT_REGION=us-east-1
          aws --endpoint-url http://localhost:9000 s3 mb s3://crm-media-test
          aws --endpoint-url http://localhost:9000 s3 mb s3://crm-backup-test

      - run: npm ci
      - run: npm run build -w @crm/shared
      - run: npm run lint
      - run: npm run typecheck
      - name: JWT kalitlari (faqat test uchun)
        run: bash scripts/gen-keys.sh
      - run: npm test
      # Migratsiya (crm_app roli ham shu yerda yaratiladi) va e2e
      - run: npm run db:deploy
      - run: npm run test:e2e -w @crm/api
      # OpenAPI hujjati kod bilan ajralmagan (12 §12.6)
      - name: OpenAPI drift
        run: |
          npm run build -w @crm/api
          # Ilova muhitni ishga tushishda tekshiradi — test muhiti bilan
          set -a && . apps/api/.env.test && set +a
          npm run openapi -w @crm/api
          git diff --exit-code apps/api/openapi.json
