# ═══════════════════════════════════════════════════════════════════
# Postgres (T-117, 11 §11.5) — Oracle A1: 2 OCPU / 12 GB RAM, SSD
# ═══════════════════════════════════════════════════════════════════
listen_addresses = '*'
# API ulanish puli 10 (DEFAULT_CONNECTION_LIMIT) × instansiyalar + migratsiya + zaxira
max_connections = 40
shared_buffers = 3GB                  # RAM ning ~25%
effective_cache_size = 8GB
work_mem = 16MB                       # 40 ulanish × bir necha saralash — xotiraga sig'adi
maintenance_work_mem = 512MB          # VACUUM, indeks yaratish, REFRESH MATERIALIZED VIEW
random_page_cost = 1.1                # SSD
effective_io_concurrency = 200
wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = 2GB

# Kuzatuv: sekin so'rovlar va ularning rejasi (10 §10.10)
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.track = all
log_min_duration_statement = 100
auto_explain.log_min_duration = 200
auto_explain.log_analyze = off
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
deadlock_timeout = 1s

timezone = 'UTC'
