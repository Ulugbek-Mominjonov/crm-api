# ═══════════════════════════════════════════════════════════════════
# CRM production (T-116, 11 §11.5): /opt/crm/docker-compose.prod.yml
#   docker compose -f docker-compose.prod.yml up -d
# Tashqariga hech bir servis port CHIQARMAYDI: Redis — faqat loyihaning ichki
# tarmog'ida, baza — qo'shimcha serverning o'zida (127.0.0.1, SSH tunnel orqali
# DBeaver uchun); API — umumiy `edge` tarmog'ida `crm-api` nomi bilan, unga
# umumiy Caddy (/opt/edge, 80/443, TLS) yo'naltiradi.
# ═══════════════════════════════════════════════════════════════════

x-logging: &logging
  # Log rotatsiyasi (T-122): disk to'lib qolmasin
  driver: json-file
  options: { max-size: 20m, max-file: '5' }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    secrets: [db_password]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm']
      interval: 10s
      retries: 10
    # Faqat 127.0.0.1 — internetdan ko'rinmaydi; DBeaver/psql SSH tunnel orqali (infra/README.md)
    ports: ['127.0.0.1:5432:5432']
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Navbat (BullMQ) va kesh: xotira chegarasi, diskka yozmaydi
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --save ''
    expose: ['6379']
    logging: *logging

  api:
    image: ghcr.io/${GH_OWNER}/crm-api:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    secrets: [jwt_private.pem, jwt_public.pem]
    expose: ['3000']
    networks:
      default: {}
      # Umumiy Caddy shu nom bilan topadi (boshqa loyihaning `api` si bilan aralashmaydi)
      edge: { aliases: [crm-api] }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 1g }
    logging: *logging

networks:
  edge: { external: true }

volumes: { pgdata: }

secrets:
  db_password: { file: ./secrets/db_password.txt }
  jwt_private.pem: { file: ./secrets/jwt_private.pem }
  jwt_public.pem: { file: ./secrets/jwt_public.pem }
