# Lokal ishlab chiqish muhiti.
# Portlar ataylab standartdan farqli: mashinada native Postgres/Redis
# ishlayotgan bo'lsa ham to'qnashuv bo'lmasin.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports: ['5433:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save '' --appendonly no
    ports: ['6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # `minio/minio` Docker Hub'da endi yo'q — Chainguard uni manbadan yig'adi (bepul faqat `latest`).
  # Obrazda qobiq va `mc` yo'q — sog'liq tekshiruvi o'rniga minio-init qayta urinadi. Root —
  # avvalgi `minio/minio` (root) yozgan hajm bilan ham ishlasin (obraz sukut bo'yicha uid 65532)
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: '0:0'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

  # Bucket'larni bir marta yaratadi va chiqadi (MinIO hali tayyor bo'lmasa — qayta urinadi)
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on: [minio]
    restart: on-failure
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    command: ['mb', '--ignore-existing', 'local/crm-media-dev', 'local/crm-backup-dev']

volumes: { pgdata: , miniodata: }
