# Lokal ishlab chiqish muhiti.
# Portlar ataylab standartdan farqli: mashinada native Postgres/Redis
# ishlayotgan bo'lsa ham to'qnashuv bo'lmasin.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports: ['5433:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save '' --appendonly no
    ports: ['6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  # Bucket'larni bir marta yaratadi va chiqadi
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/crm-media-dev &&
      mc mb --ignore-existing local/crm-backup-dev &&
      echo 'bucketlar tayyor'"

volumes: { pgdata: , miniodata: }
